[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autumnmail"
version = "0.1.0"
description = "秋信 · 本地优先的秋招邮件助手（QQ / 163 / Outlook）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.3",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["nuitka>=2.4"]

[project.scripts]
autumnmail = "autumnmail.desktop:main"

[tool.setuptools.packages.find]
include = ["autumnmail*"]

[tool.setuptools.package-data]
autumnmail = ["store/*.sql", "web/*.html", "web/*.svg", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
